<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 2px solid #555; background: #000; }
        #status { margin-top: 10px; color: #fff; }
    </style>
</head>
<body>
    <h3>MSI Z790 - HYPER-VM (SMART RGB MODE)</h3>
    <input type="file" id="biosInput">
    <canvas id="vm-canvas" width="640" height="480"></canvas>
    <div id="status">GPU STATUS: WAITING FOR COMMAND...</div>

    <script>
        const canvas = document.getElementById('vm-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const vram = new Uint8ClampedArray(640 * 480 * 4);
        let cpu = { IP: 0x500, running: false };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                cpu.running = true;
                initSmartVM(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function initSmartVM(rom) {
            function loop() {
                if (!cpu.running) return;

                for (let i = 0; i < 50000; i++) {
                    if (cpu.IP >= rom.length) cpu.IP = 0x500;

                    // AKILLI GPU: Sadece INT 10h gelince tetiklen
                    if (rom[cpu.IP] === 0xCD && rom[cpu.IP + 1] === 0x10) {
                        renderRGBFrame(rom, cpu.IP);
                        status.innerText = "GPU STATUS: RENDERING RGB FRAME...";
                    }
                    cpu.IP++;
                }
                requestAnimationFrame(loop);
            }
            loop();
        }

        // SADECE RGB İŞLEYEN RENDERER
        function renderRGBFrame(rom, startAddr) {
            let dataOffset = startAddr + 0x200; // BIOS grafik verisinin başlangıcı
            
            for (let i = 0; i < (640 * 480); i++) {
                let pixelIdx = i * 4;
                let romIdx = dataOffset + (i * 3);

                if (romIdx + 2 < rom.length) {
                    vram[pixelIdx] = rom[romIdx];     // R
                    vram[pixelIdx + 1] = rom[romIdx + 1]; // G
                    vram[pixelIdx + 2] = rom[romIdx + 2]; // B
                    vram[pixelIdx + 3] = 255;         // Alpha
                }
            }
            ctx.putImageData(new ImageData(vram, 640, 480), 0, 0);
        }
    </script>
</body>
</html>
