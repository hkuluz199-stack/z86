<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MSI Z790 - UEFI BIOS Arayüzü</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #bios-gui { width: 800px; height: 600px; background: linear-gradient(135deg, #000, #111); border: 2px solid #ff004d; border-radius: 10px; position: relative; }
        #header { color: #ff004d; font-family: sans-serif; padding: 20px; border-bottom: 1px solid #333; }
        #menu { color: #fff; padding: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <input type="file" id="filePicker" style="margin-bottom:10px;">
    
    <div id="bios-gui">
        <div id="header">MSI CLICK BIOS 5 - Z790</div>
        <div id="menu">
            [CPU] Intel Core i9-14900K<br>
            [DRAM] 32GB DDR5 6000MHz<br>
            [STATUS] BIOS Görüntüleyici Başarılı...<br><br>
            > BIOS Dosyası Seçildi: <span id="fileName">Yok</span>
        </div>
    </div>

    <script>
        document.getElementById('filePicker').onchange = function(e) {
            const file = e.target.files[0];
            document.getElementById('fileName').innerText = file.name;
            
            // BIOS içindeki rastgele verileri görselleştirme (Fake Graphics)
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                // Burada BIOS'un grafik verilerini (pixel map) manipüle edebiliriz
                console.log("BIOS Yükleniyor: " + data.length + " bayt.");
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
</body>
</html>
