<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; display: flex; flex-direction: column; align-items: center; font-family: monospace; }
        canvas { border: 4px solid #333; background: #000; }
        #system-status { width: 640px; padding: 10px; border: 1px solid #444; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h3>MSI Z790 - HYPER-VM (5GB RAM | 4GB VRAM | 64GB STORAGE)</h3>
    <input type="file" id="biosInput">
    <canvas id="vga-display" width="640" height="480"></canvas>
    <div id="system-status">SİSTEM HAZIR: DOSYA BEKLENİYOR...</div>

    <script>
        // DONANIM MİMARİSİ
        const CONFIG = {
            RAM: 5 * 1024 * 1024 * 1024,
            VRAM: 4 * 1024 * 1024 * 1024,
            STORAGE: 64 * 1024 * 1024 * 1024
        };

        const canvas = document.getElementById('vga-display');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('system-status');
        
        let cpu = { IP: 0x500, running: false };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                cpu.running = true;
                bootMachine(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function bootMachine(rom) {
            status.innerText = "SİSTEM BAŞLATILIYOR (POST)...";
            
            function cycle() {
                if (!cpu.running) return;

                // TURBO DÖNGÜ (50K işlem/kare)
                for (let i = 0; i < 50000; i++) {
                    if (cpu.IP >= CONFIG.RAM) cpu.IP = 0x500;
                    
                    // BIOS komut çözücü
                    let op = rom[cpu.IP % rom.length];

                    // VRAM / VGA Tetikleyici
                    if (op === 0xCD && rom[(cpu.IP + 1) % rom.length] === 0x10) {
                        triggerGraphics();
                    }
                    cpu.IP++;
                }

                status.innerText = `CPU: 3.0GHz | RAM: ${CONFIG.RAM / 1024**3}GB | VRAM: ${CONFIG.VRAM / 1024**3}GB | STORAGE: 64GB | IP: 0x${cpu.IP.toString(16).toUpperCase()}`;
                requestAnimationFrame(cycle);
            }
            cycle();
        }

        function triggerGraphics() {
            // 4GB VRAM simülasyonu görselleştirme
            ctx.fillStyle = "#8b0000"; 
            ctx.fillRect(0, 0, 640, 480);
            ctx.fillStyle = "#fff";
            ctx.font = "24px Arial";
            ctx.fillText("MSI CLICK BIOS 5 - INITIALIZED", 120, 240);
        }
    </script>
</body>
</html>
