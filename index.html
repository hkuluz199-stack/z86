<!DOCTYPE html>
<html>
<body>
    <h1>BIOS Analizcisi</h1>
    <input type="file" id="biosInput">
    <div id="log" style="color:red; font-family:monospace; margin-top:20px;"></div>

    <script>
        const input = document.getElementById('biosInput');
        const logDiv = document.getElementById('log');

        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            logDiv.innerText = "Dosya algılandı: " + file.name + "\n";
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const arr = new Uint8Array(evt.target.result);
                let hexOutput = "İçerik (ilk 20 bayt): ";
                for(let i=0; i<20; i++) {
                    hexOutput += arr[i].toString(16).toUpperCase().padStart(2, '0') + " ";
                }
                logDiv.innerText += hexOutput;
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
</body>
</html>
