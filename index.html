<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; }
        #monitor { width: 640px; height: 400px; border: 2px solid #333; background: #000; color: #0f0; padding: 10px; overflow-y: scroll; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Z790 BARE-METAL EMÜLATÖR</h1>
    <input type="file" id="biosInput">
    <div id="monitor">Sistem BIOS bekleniyor...</div>

    <script>
        const monitor = document.getElementById('monitor');
        
        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                execute(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function execute(rom) {
            let IP = 0; // Instruction Pointer
            let registers = { AX: 0, BX: 0 };
            monitor.innerHTML = "--- EMÜLASYON BAŞLATILDI ---\n";

            // İCRA DÖNGÜSÜ (Burası işlemcinin kalbidir)
            const interval = setInterval(() => {
                if (IP >= rom.length) { clearInterval(interval); return; }

                let opcode = rom[IP];
                let output = `[IP:0x${IP.toString(16).toUpperCase().padStart(4, '0')}] OP:0x${opcode.toString(16).toUpperCase().padStart(2, '0')} -> `;

                // KOMUT ÇÖZÜCÜ (DECODE & EXECUTE)
                switch(opcode) {
                    case 0x90: output += "NOP (CPU Boşta)"; break;
                    case 0xB8: output += "MOV AX, imm16 (Register Yükle)"; IP += 2; break;
                    case 0xEB: output += "JMP (Atla)"; break;
                    case 0x11: output += "ADC (Topla)"; break;
                    case 0xFF: output += "CALL (Alt Rutine Git)"; break;
                    default:   output += "BİLİNMEYEN KOMUT (Hata)";
                }

                monitor.innerHTML += output + "\n";
                monitor.scrollTop = monitor.scrollHeight;
                IP++;
            }, 50); // 50ms hızında çalıştır
        }
    </script>
</body>
</html>
