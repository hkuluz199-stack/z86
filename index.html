<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 4px solid #444; background: #000; image-rendering: pixelated; width: 640px; height: 480px; }
        #status { margin-top: 10px; color: #fff; font-size: 14px; }
    </style>
</head>
<body>
    <h3>MSI Z790 - HYPER-VM (DECODER ACTIVE)</h3>
    <input type="file" id="biosInput">
    <canvas id="vm-canvas" width="640" height="480"></canvas>
    <div id="status">STATUS: WAITING FOR BIOS DATA...</div>

    <script>
        const canvas = document.getElementById('vm-canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        
        // RLE Decoder: Sıkıştırılmış veriyi çözer, paraziti temizler
        function decodeRLE(rom, startAddr) {
            let decoded = new Uint8ClampedArray(640 * 480 * 4);
            let pixelPtr = 0;
            let romPtr = startAddr;

            while (pixelPtr < decoded.length && romPtr < rom.length - 4) {
                let count = rom[romPtr];   // Tekrar sayısı
                let r = rom[romPtr + 1];   // Kırmızı
                let g = rom[romPtr + 2];   // Yeşil
                let b = rom[romPtr + 3];   // Mavi
                
                // Parazit önleme: Eğer count çok büyükse (geçersiz blok) atla
                if (count > 0 && count < 255) {
                    for (let i = 0; i < count; i++) {
                        if (pixelPtr < decoded.length) {
                            decoded[pixelPtr] = r;
                            decoded[pixelPtr + 1] = g;
                            decoded[pixelPtr + 2] = b;
                            decoded[pixelPtr + 3] = 255;
                            pixelPtr += 4;
                        }
                    }
                }
                romPtr += 4; 
            }
            return decoded;
        }

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                // BIOS'un grafik tablosu genelde 0x5000 offset'inden başlar
                const imgData = new ImageData(decodeRLE(rom, 0x5000), 640, 480);
                ctx.putImageData(imgData, 0, 0);
                status.innerText = "STATUS: DECODING COMPLETE. FRAME RENDERED.";
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };
    </script>
</body>
</html>
