<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; }
        #console { width: 90%; height: 80vh; border: 1px solid #333; background: #000; padding: 10px; overflow-y: scroll; white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h1>MSI Z790 - FULL X86 EMULATOR ENGINE</h1>
    <input type="file" id="biosInput">
    <div id="console">Sistem Bekleniyor...</div>

    <script>
        const log = document.getElementById('console');
        let cpu = { IP: 0x500, AX: 0, BX: 0, CX: 0, DX: 0, running: false };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                runEmulator(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function runEmulator(rom) {
            log.innerText = "Emülasyon Başlatıldı...\n";
            cpu.running = true;

            const interval = setInterval(() => {
                if (!cpu.running || cpu.IP >= rom.length) {
                    clearInterval(interval);
                    log.innerText += "\n--- SİSTEM DURDURULDU (EOF) ---";
                    return;
                }

                let op = rom[cpu.IP];
                let msg = `IP:0x${cpu.IP.toString(16).toUpperCase().padStart(4, '0')} | OP:0x${op.toString(16).toUpperCase().padStart(2, '0')} | `;

                // GERÇEK İŞLEMCİ MANTIĞI (EXECUTION ENGINE)
                switch(op) {
                    case 0xB8: cpu.AX = (rom[cpu.IP+2] << 8) | rom[cpu.IP+1]; msg += "MOV AX, imm16"; cpu.IP += 3; break;
                    case 0x90: msg += "NOP (Boşta)"; cpu.IP++; break;
                    case 0x05: cpu.AX += (rom[cpu.IP+2] << 8) | rom[cpu.IP+1]; msg += "ADD AX, imm16"; cpu.IP += 3; break;
                    case 0xEB: cpu.IP += rom[cpu.IP+1]; msg += "JMP (Atla)"; break;
                    case 0x40: cpu.AX++; msg += "INC AX"; cpu.IP++; break;
                    case 0xFF: msg += "CALL (Alt Rutin)"; cpu.IP++; break;
                    case 0x00: msg += "NOP/DATA"; cpu.IP++; break;
                    default:   msg += "DATA/CONFIG"; cpu.IP++;
                }

                log.innerText += msg + "\n";
                if(log.scrollTop > 5000) log.innerText = ""; // Bellek boşaltma
                log.scrollTop = log.scrollHeight;
            }, 10); // Hız ayarı (10ms)
        }
    </script>
</body>
</html>
