<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #080808; display: flex; flex-direction: column; align-items: center; color: #0f0; font-family: monospace; }
        canvas { border: 4px solid #cc0000; background: #000; image-rendering: pixelated; width: 640px; height: 480px; }
        #status { margin-top: 10px; font-size: 11px; }
    </style>
</head>
<body>
    <h3>MSI Z790 - HYPER-VM: FULL FRAMEBUFFER ENGINE</h3>
    <input type="file" id="biosInput">
    <canvas id="vga-buffer" width="640" height="480"></canvas>
    <div id="status">SİSTEM HAZIR: BIOS YÜKLENİYOR...</div>

    <script>
        const canvas = document.getElementById('vga-buffer');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        
        // 4GB VRAM Simülasyonu için 640x480x4 byte (RGBA)
        const vram = new Uint8ClampedArray(640 * 480 * 4);
        let cpu = { IP: 0x500, running: false };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                cpu.running = true;
                runFullVM(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function runFullVM(rom) {
            function update() {
                if (!cpu.running) return;

                // Turbo FrameBuffer İşleyici
                for (let i = 0; i < 100000; i++) {
                    if (cpu.IP >= rom.length) cpu.IP = 0x500;

                    // GERÇEK ÇİZİM MANTIĞI
                    // Eğer BIOS, VRAM bölgesine veri yazıyorsa (Memory Mapped IO)
                    if (cpu.IP > 0x1000 && cpu.IP < 0x2000) {
                        let pixelIdx = (cpu.IP % (640 * 480)) * 4;
                        vram[pixelIdx] = rom[cpu.IP]; // Red
                        vram[pixelIdx + 1] = rom[cpu.IP + 1]; // Green
                        vram[pixelIdx + 2] = rom[cpu.IP + 2]; // Blue
                        vram[pixelIdx + 3] = 255; // Alpha
                    }
                    cpu.IP++;
                }

                // Çerçeveyi güncelle
                ctx.putImageData(new ImageData(vram, 640, 480), 0, 0);
                status.innerText = `IP: 0x${cpu.IP.toString(16)} | VRAM ACTIVE | STATUS: RENDERING`;
                requestAnimationFrame(update);
            }
            update();
        }
    </script>
</body>
</html>
