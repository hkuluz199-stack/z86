<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; display: flex; flex-direction: column; align-items: center; font-family: monospace; }
        canvas { background: #000; border: 4px solid #ff004d; width: 640px; height: 480px; }
        #monitor { width: 640px; height: 100px; background: #111; padding: 10px; font-size: 12px; margin-top: 10px; border: 1px solid #444; }
    </style>
</head>
<body>
    <h1>MSI Z790 - TURBO VGA ENGINE</h1>
    <input type="file" id="biosInput">
    <canvas id="vga" width="640" height="480"></canvas>
    <div id="monitor">Sistem Hazır... Bekleniyor...</div>

    <script>
        const canvas = document.getElementById('vga');
        const ctx = canvas.getContext('2d');
        const monitor = document.getElementById('monitor');
        const vram = new Uint8ClampedArray(640 * 480 * 4);
        
        let cpu = { IP: 0x500, AX: 0, running: false };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                cpu.running = true;
                emulate(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function emulate(rom) {
            function tick() {
                if (!cpu.running) return;

                // TURBO DÖNGÜ: 50.000 komut/kare
                for (let i = 0; i < 50000; i++) {
                    if (cpu.IP >= rom.length) cpu.IP = 0x500;

                    let op = rom[cpu.IP];

                    // 1. BOŞLUK ATLATICI (0xFF - BIOS Padding)
                    if (op === 0xFF) { cpu.IP++; continue; }

                    // 2. GRAFİK KESMESİ (INT 10h - GUI Başlatıcı)
                    if (op === 0xCD && rom[cpu.IP + 1] === 0x10) {
                        monitor.innerText = "GRAFİK ARAYÜZÜ (MSI GUI) BAŞLATILDI: 0x" + cpu.IP.toString(16);
                        vram.fill(50, 0, vram.length); // Arka planı MSI Gri yap
                        ctx.putImageData(new ImageData(vram, 640, 480), 0, 0);
                    }

                    cpu.IP++;
                }

                monitor.innerText = `CPU İŞLENİYOR... IP: 0x${cpu.IP.toString(16).toUpperCase()} | AX: 0x${cpu.AX.toString(16)}`;
                requestAnimationFrame(tick);
            }
            tick();
        }
    </script>
</body>
</html>
