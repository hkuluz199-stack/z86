<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MSI Z790 - Pentium 4 Emülatör</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #vga { width: 800px; height: 500px; background: #000; border: 4px solid #ff004d; margin-top: 10px; }
        #stats { width: 800px; color: #fff; font-size: 14px; background: #111; padding: 10px; }
    </style>
</head>
<body>
    <h1>MSI Z790 - CORE ENGINE (P4 3.0GHz SIM)</h1>
    <input type="file" id="biosInput">
    <canvas id="vga"></canvas>
    <div id="stats">Sistem Başlatılıyor...</div>

    <script>
        const ctx = document.getElementById('vga').getContext('2d');
        let CPU = { AX: 0, IP: 0, running: false };
        let biosData;
        const BATCH = 50000; // 3.0GHz Hız Simülasyonu (Döngü başına işlem)

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                biosData = new Uint8Array(evt.target.result);
                CPU.running = true;
                tick();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function tick() {
            if (!CPU.running) return;

            // PENTIUM 4 HIZINDA İCRA (Batch Processing)
            for (let i = 0; i < BATCH; i++) {
                if (CPU.IP >= biosData.length) { CPU.running = false; break; }
                
                let opcode = biosData[CPU.IP];
                // Basit Decode/Execute
                if (opcode === 0xB8) CPU.AX = 0xFFFF; // Örnek komut: MOV AX, FFFF
                CPU.IP++;
            }

            // GÖRÜNTÜLEME (GPU VRAM)
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 800, 500);
            ctx.fillStyle = "#0f0";
            ctx.fillText("CPU: PENTIUM 4 631 3.0GHz", 20, 30);
            ctx.fillText("AX REGISTER: 0x" + CPU.AX.toString(16).toUpperCase(), 20, 50);
            ctx.fillText("IP (PC): 0x" + CPU.IP.toString(16).toUpperCase(), 20, 70);
            ctx.fillText("Hız: 3.0GHz (Batch: " + BATCH + ")", 20, 90);
            
            // Grafik Yükü (BIOS'un görselleştirilmesi)
            ctx.strokeStyle = "#ff004d";
            ctx.strokeRect(50, 150, (CPU.IP / biosData.length) * 700, 20);
            
            requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
