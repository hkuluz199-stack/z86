<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #111; color: #0f0; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 2px solid #ff004d; background: #000; image-rendering: pixelated; }
        #log { width: 800px; height: 150px; background: #000; color: #fff; font-size: 10px; overflow: hidden; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>MSI Z790 - VGA GRAPHICS CORE</h1>
    <input type="file" id="biosInput">
    <canvas id="vga" width="640" height="480"></canvas>
    <div id="log">Sistem Bekleniyor...</div>

    <script>
        const canvas = document.getElementById('vga');
        const ctx = canvas.getContext('2d');
        const log = document.getElementById('log');
        
        // VGA / VRAM Mimarisi (640x480 - BIOS Standart)
        let vram = new Uint8ClampedArray(640 * 480 * 4);
        let cpu = { IP: 0x500, AX: 0, running: false };

        function updateDisplay() {
            let imgData = new ImageData(vram, 640, 480);
            ctx.putImageData(imgData, 0, 0);
        }

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const rom = new Uint8Array(evt.target.result);
                cpu.running = true;
                emulate(rom);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function emulate(rom) {
            setInterval(() => {
                if (!cpu.running) return;
                
                // BIOS Döngüsü (Reset/Boot Loop)
                if (cpu.IP >= rom.length) cpu.IP = 0x500;

                let op = rom[cpu.IP];
                
                // VGA KESMESİ (INT 10h) - Grafik motorunu tetikle
                if (op === 0xCD && rom[cpu.IP + 1] === 0x10) {
                    log.innerText = "BIOS: EKRAN KARTI KOMUTU (INT 10h) ALINDI!\n" + log.innerText;
                    // VRAM'e sanal bir renk bas (örnek: MSI kırmızı)
                    for(let i=0; i<vram.length; i+=4) { vram[i]=255; vram[i+3]=255; }
                    updateDisplay();
                }

                // Komut İşleme
                cpu.IP++;
            }, 1);
        }
    </script>
</body>
</html>
