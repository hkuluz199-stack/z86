<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 4px solid #333; background: #000; image-rendering: pixelated; width: 640px; height: 480px; }
        #monitor { margin-top: 10px; padding: 5px; border: 1px solid #555; }
    </style>
</head>
<body>
    <h3>MSI HYPER-VM: 60Hz RENDER ENGINE</h3>
    <input type="file" id="biosInput">
    <canvas id="vm-canvas" width="320" height="200"></canvas>
    <div id="monitor">MONITOR: 60Hz | STATUS: SYNCING...</div>

    <script>
        const canvas = document.getElementById('vm-canvas');
        const ctx = canvas.getContext('2d');
        const monitor = document.getElementById('monitor');
        let romData = null;

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                romData = new Uint8Array(evt.target.result);
                // 60Hz Render Döngüsünü Başlat
                requestAnimationFrame(renderLoop);
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function renderLoop() {
            if (!romData) return;

            // BIOS Modunu her karede kontrol et (60 FPS'de tepki süresi)
            let mode = romData[0x10] === 0x07 ? "TEXT" : "VGA";
            
            if (mode === "TEXT") {
                renderTextMode();
            } else {
                renderVgaMode();
            }

            monitor.innerText = `MONITOR: 60Hz | MODE: ${mode} | SYNC: OK`;
            requestAnimationFrame(renderLoop); // 60 FPS'de yenile
        }

        function renderTextMode() {
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,320,200);
            ctx.fillStyle = "#0f0"; ctx.font = "12px monospace";
            for(let i=0; i<20; i++) {
                ctx.fillText(String.fromCharCode(romData[0x500+i] || 32), (i%20)*12, Math.floor(i/20)*16 + 16);
            }
        }

        function renderVgaMode() {
            const imgData = ctx.createImageData(320, 200);
            for (let i = 0; i < 320 * 200; i++) {
                let addr = 0x5000 + (i % (romData.length - 0x5000));
                imgData.data[i*4] = romData[addr];
                imgData.data[i*4+1] = romData[addr+1];
                imgData.data[i*4+2] = romData[addr+2];
                imgData.data[i*4+3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
