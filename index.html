<!DOCTYPE html>
<html lang="tr">
<head>
    <title>Z790 X86 Emulator - JIT Mode</title>
    <style>
        body { background: #1a1a1a; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        #vga { background: #000; border: 4px solid #444; width: 640px; height: 400px; cursor: crosshair; }
        #controls { margin: 10px; }
    </style>
</head>
<body>
    <h1>Z790 JIT Emülatör</h1>
    <input type="file" id="biosInput">
    <canvas id="vga" width="640" height="400"></canvas>
    <div id="controls">
        Durum: <span id="status">BIOS Bekleniyor...</span> | Klavye: <span id="key">Yok</span>
    </div>

    <script>
        const vga = document.getElementById('vga');
        const ctx = vga.getContext('2d');
        
        // Emülatör Çekirdeği
        let biosData;
        
        // Klavye ve Mouse Etkileşimi
        window.onkeydown = (e) => { document.getElementById('key').innerText = e.key; };
        vga.onmousemove = (e) => { /* VRAM'e mouse koordinatlarını yaz */ };

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                biosData = new Uint8Array(evt.target.result);
                document.getElementById('status').innerText = "BIOS Yüklendi! JIT Hazır.";
                renderVGA(); // Emülatörü başlat
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        // JIT (Just-In-Time) Simülasyonu: Basit Fetch-Decode
        function renderVGA() {
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,640,400);
            ctx.fillStyle = "#0f0"; ctx.font = "12px monospace";
            
            // BIOS'un ilk kodlarını ekrana yaz (VRAM simülasyonu)
            for(let i=0; i<20; i++) {
                ctx.fillText(`FETCH 0x${i.toString(16)}: ${biosData[i].toString(16).toUpperCase()}`, 20, 20 + (i*20));
            }
            requestAnimationFrame(renderVGA);
        }
    </script>
</body>
</html>
