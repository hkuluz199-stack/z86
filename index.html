<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MSI Z790 Emülatör - Yürütme Birimi</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        #vga-display { width: 640px; height: 400px; background: #000; border: 2px solid #ff004d; }
    </style>
</head>
<body>
    <h1>MSI Z790 - Sanal CPU İcra Birimi</h1>
    <input type="file" id="biosInput">
    <canvas id="vga-display"></canvas>
    <div id="status">Sistem Bekliyor...</div>

    <script>
        const ctx = document.getElementById('vga-display').getContext('2d');
        let biosData;

        document.getElementById('biosInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                biosData = new Uint8Array(evt.target.result);
                executeEngine();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        function executeEngine() {
            let IP = 0; // Instruction Pointer
            
            // Grafik İcra Döngüsü
            function tick() {
                if (IP >= biosData.length) return;

                // FETCH: Komutu getir
                let opcode = biosData[IP];
                
                // DECODE & EXECUTE: Komutu işle
                ctx.fillStyle = "#000"; ctx.fillRect(0,0,640,400);
                ctx.fillStyle = "#ff004d";
                ctx.fillText("İşlemci İcra Ediyor...", 20, 30);
                ctx.fillStyle = "#0f0";
                ctx.fillText("IP Adresi: 0x" + IP.toString(16), 20, 60);
                ctx.fillText("Opcode: 0x" + opcode.toString(16), 20, 80);
                
                // Klavye/Mouse Etkileşimli Port Gözlemleme
                // (BIOS kodları buraya yazıldığında ekran güncellenir)
                IP++; 
                setTimeout(tick, 100); // İşlemci hızını 100ms'ye sabitledik
            }
            tick();
        }
    </script>
</body>
</html>
