<!DOCTYPE html>
<html>
<body style="background:#000; color:#0f0; font-family:monospace;">
    <h1>MSI Z790 - BIOS Analyzer (32MB Destekli)</h1>
    <input type="file" id="biosInput">
    <div id="stats" style="white-space: pre;">Dosya seç ve oku...</div>

    <script>
        document.getElementById('biosInput').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const stats = document.getElementById('stats');
                
                // 32MB dosyayı tamamen ekrana basarsan tarayıcı çöker.
                // Sadece ilk 500 satırı gösteriyoruz.
                stats.innerText = "Dosya Boyutu: " + (data.length / 1024 / 1024).toFixed(2) + " MB\n\n";
                
                let output = "";
                for(let i = 0; i < 500; i++) {
                    let hex = data[i].toString(16).toUpperCase().padStart(2, '0');
                    output += "Adres 0x" + i.toString(16).toUpperCase().padStart(5, '0') + ": 0x" + hex + "\n";
                }
                stats.innerText += output;
            };
            reader.readAsArrayBuffer(file);
        };
    </script>
</body>
</html>
